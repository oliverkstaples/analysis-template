[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "analysis-template"
requires-python = ">=3.11"
version = "0.0.0"

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
matplotlib = "*"
numpy = "*"
pandas = "*"
scipy = "*"
scienceplots = "*"

[tool.pixi.pypi-dependencies]
analysis-template = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
ipykernel = "*"
pandas-stubs = "*"
pytest = "*"
snakemake = "*"
ty = "*"
tectonic = "*"

[tool.pixi.environments]
default = { features = ["dev"] }

# A fixed timestamp (1980-01-01) that matplotlib and tectonic write into SVG and PDF files in
# place of the build time, so rebuilding unchanged outputs gives byte-identical files.
[tool.pixi.activation.env]
SOURCE_DATE_EPOCH = "315532800"

[tool.pixi.feature.dev.tasks]
lint = "ruff check"
format = "ruff check --select I --fix && ruff format"
typecheck = "ty check"
test = "pytest"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Scripts are run as modules from the repo root (`python -m scripts.<name>`), which the src
# layout's editable install doesn't put on sys.path; do so here so tests can import them too.
pythonpath = ["."]

[tool.ruff.lint]
extend-select = ["I"]

[tool.hatch.build.targets.sdist]
include = ["src/analysis_template/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/analysis_template"]
